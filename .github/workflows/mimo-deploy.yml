name: MiniMoment Deploy

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Set up application.properties
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties

      - name: Set up Maven
        uses: actions/setup-java@v3
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Clean with Maven
        run: mvn clean

      - name: Install with Maven
        run: mvn install
        
  docker-login:
     runs-on: ubuntu-latest
     needs: build
     steps:
      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        
  build-docker-image:
    runs-on: ubuntu-latest
    needs: docker-login
    steps:
      - name : print this directory
        run: pwd
      - name: List files in the current directory
        run: ls -al
      - name: Build the Docker image
        run: docker build -t ${{ secrets.DOCKER_REPO }} -f ../Dockerfile .
        
  push-docker-image:
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Push the Docker image
        run: docker push ${{ secrets.DOCKER_REPO }}
        
  deploy-ec2-server:
    runs-on: ubuntu-latest
    needs: push-docker-image
    steps:
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@master
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            CONTAINER_ID=$(sudo docker ps -q --filter "publish=80-8080")
            if [ ! -z "$CONTAINER_ID" ]; then
              sudo docker stop $CONTAINER_ID
              sudo docker rm $CONTAINER_ID
            fi
            IMAGE_ID=$(sudo docker images -q ${{ secrets.DOCKER_REPO}})
            if [ ! -z "$IMAGE_ID" ]; then
              sudo docker rmi $IMAGE_ID
            fi
            sudo docker pull ${{ secrets.DOCKER_REPO }}
            sudo docker run --name ${{ secrets.DOCKER_CONTAINER_NAME }} -d -p 8080:8080 ${{ secrets.DOCKER_REPO }}
            sudo docker logs ${{ secrets.DOCKER_CONTAINER_NAME }}
